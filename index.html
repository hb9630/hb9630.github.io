<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>hb9630 · 项目主页</title>
<meta name="description" content="hb9630 的 GitHub Pages 项目主页" />
<link rel="icon" href="https://github.com/hb9630.png" />
<style>
  :root {
    --bg: #f6f7f5;
    --card: #ffffff;
    --text: #17181a;
    --text-2: #5c5e57;
    --text-3: #8b8d84;
    --border: #e6e7e2;
    --accent: #1a7a52;
    --accent-soft: rgba(26, 122, 82, 0.08);
    --dot-live: #1a9a5c;
    --shadow: 0 1px 2px rgba(20, 24, 20, 0.04), 0 8px 24px -12px rgba(20, 24, 20, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101211;
      --card: #191b1a;
      --text: #eceee9;
      --text-2: #a8aaa2;
      --text-3: #76786f;
      --border: #262927;
      --accent: #3ec98a;
      --accent-soft: rgba(62, 201, 138, 0.1);
      --dot-live: #3ec98a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'PingFang SC', 'PingFang HK', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px 40px; }

  /* 头部 */
  header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
  .avatar-ring {
    width: 84px; height: 84px; border-radius: 50%; padding: 3px; flex-shrink: 0;
    background: conic-gradient(from 210deg, var(--accent), #6fcf97 45%, #b8e6cc 75%, var(--accent));
  }
  .avatar-ring img { width: 100%; height: 100%; border-radius: 50%; display: block; background: var(--card); }
  h1 { font-size: 26px; letter-spacing: -0.02em; }
  .bio { color: var(--text-2); font-size: 14px; margin-top: 6px; line-height: 1.6; }
  .bio b { color: var(--text); font-weight: 600; }
  .gh-link {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    font-size: 13px; color: var(--text-2); text-decoration: none;
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; transition: all .15s;
  }
  .gh-link:hover { color: var(--text); border-color: var(--text-3); }

  /* 区块标题 */
  .sec-title {
    font-size: 13px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 16px;
  }

  /* 卡片网格 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; text-decoration: none; color: var(--text);
    box-shadow: var(--shadow); transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .icon {
    width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
    font-size: 24px; background: var(--accent-soft); color: var(--accent);
    font-weight: 700;
  }
  .live { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-3); }
  .live::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--dot-live); box-shadow: 0 0 0 3px rgba(26, 154, 92, 0.15);
  }
  .card h2 { font-size: 17px; letter-spacing: -0.01em; }
  .card p { font-size: 13px; color: var(--text-2); line-height: 1.65; flex: 1; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .path {
    font-size: 12px; color: var(--accent); font-weight: 600;
    background: var(--accent-soft); border-radius: 7px; padding: 3px 9px;
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  .arrow { color: var(--text-3); font-size: 15px; transition: transform .18s ease, color .18s ease; }
  .card:hover .arrow { transform: translateX(3px); color: var(--accent); }

  /* 占位卡（未来项目） */
  .card.ghost {
    border-style: dashed; box-shadow: none; align-items: center; justify-content: center;
    text-align: center; min-height: 170px; color: var(--text-3);
  }
  .card.ghost:hover { transform: none; border-color: var(--border); }
  .ghost .plus { font-size: 22px; margin-bottom: 6px; }
  .ghost span { font-size: 13px; }

  footer {
    margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-3); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: var(--text-3); text-decoration: none; }
  footer a:hover { color: var(--text); }

  @media (max-width: 560px) {
    .wrap { padding: 32px 18px; }
    header { flex-direction: column; text-align: center; align-items: center; gap: 14px; margin-bottom: 32px; }
    .bio br { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar-ring">
      <img src="https://github.com/hb9630.png" alt="hb9630" width="78" height="78" />
    </div>
    <div>
      <h1>hb9630</h1>
      <p class="bio">这里收录我的项目 DEMO</p>
      <a class="gh-link" href="https://github.com/hb9630" target="_blank" rel="noopener">
        ↗ github.com/hb9630
      </a>
    </div>
  </header>

  <div class="sec-title">项目 Projects</div>
  <div class="grid" id="projects"></div>

  <footer>
    <span>© 2026 hb9630</span>
    <span><a href="https://github.com/hb9630" target="_blank" rel="noopener">GitHub</a> · GitHub Pages Hosting</span>
  </footer>
</div>

<script>
  /**
   * 项目配置 — 新增项目只需在数组加一行
   * live: true 显示绿色线上状态点；置为 false 显示为「即将上线」
   */
  const PROJECTS = [
    {
      path: 'forecast',
      icon: '📈',
      name: '大宗商品价格预测',
      desc: '农产品+工业品 18 品种期货价格预测与纸上交易。',
      live: true,
    },
    {
      path: 'bi',
      icon: '📊',
      name: '集团数据驾驶舱',
      desc: '某集团公司经营数据驾驶舱，核心指标一屏总览。',
      live: true,
    },
  ]

  const grid = document.getElementById('projects')
  grid.innerHTML =
    PROJECTS.map((p) => `
      <a class="card" href="/${p.path}/" target="_blank" rel="noopener">
        <div class="card-top">
          <div class="icon">${p.icon}</div>
          <span class="live">${p.live ? '线上' : '即将上线'}</span>
        </div>
        <div>
          <h2>${p.name}</h2>
          <p style="margin-top:6px">${p.desc}</p>
        </div>
        <div class="card-foot">
          <span class="path">/${p.path}/</span>
          <span class="arrow">→</span>
        </div>
      </a>
    `).join('') +
    `<a class="card ghost" href="https://github.com/hb9630?tab=repositories" target="_blank" rel="noopener">
       <span class="plus">＋</span>
       <span>更多项目筹备中</span>
     </a>`
</script>
</body>
</html>
